spring.application.name=frontdesk-backend

# ── Server ────────────────────────────────────────────────────────────────────
server.port=9090

# ── MySQL DataSource ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/frontdesk?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
# spring.datasource.url=jdbc:mysql://10.123.3.221:3306/frontdesk?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
# spring.datasource.username=vardhan
# spring.datasource.password=vardhan123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=FrontDeskPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=medplus-frontdesk-secure-jwt-secret-key-hyderabad-2024
jwt.expiration=86400000
jwt.token-type=Bearer

# ── SQL Initialization ────────────────────────────────────────────────────────
# Tables only: db/schema-init.sql | Admin user: app.bootstrap.admin.* below
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-init.sql

# ── Bootstrap admin (first login only — insert if employee-id does not exist) ─
# Set enabled=false in production.
app.bootstrap.admin.enabled=true
app.bootstrap.admin.employee-id=OTG001
app.bootstrap.admin.password=Admin
app.bootstrap.admin.full-name=Administrator
app.bootstrap.admin.email=admin@medplusindia.com
# app.bootstrap.admin.location=MED-HO-00001
# app.bootstrap.admin.location-name=Medplus Head Office Hyderabad

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata

# ── HRMS (OAuth + employee lookup for User Management) ───────────────────────
hrms.oauth.token-url=https://tpa.medplusindia.com/oauth-server/oauth/token?grant_type=client_credentials
hrms.oauth.client-id=ho_client
hrms.oauth.client-secret=hO!$CL
hrms.api.employee-details-url=https://tpa.medplusindia.com/hrms/service/get-employee-details

# ── OTP / SMS OAuth (deployment: tpa — not iris/marigold dev hosts) ──────
medplus.otp.token-url=https://tpa.medplusindia.com/oauth-server/oauth/token?grant_type=client_credentials
medplus.otp.client-id=ho_client
medplus.otp.client-secret=hO!$CL
medplus.otp.send-url=https://tpa.medplusindia.com/message-service/otp/send-customer-otp
medplus.otp.verify-url=https://tpa.medplusindia.com/message-service/otp/verify-customer-otp
medplus.otp.vertical=MART
medplus.otp.sms-template=MVMS
medplus.otp.requested-by=FRONTDESK

# ── Visit pass (desk walk-in QR card → image → shorten → SMS) ───────────────
app.visit-pass.enabled=true

# Image upload (marigold interim — OAuth on :6728, transit on :6426 per MedPlus docs)
medplus.image.oauth.token-url=https://tpa.medplusindia.com/oauth-server/oauth/token?grant_type=client_credentials
medplus.image.oauth.client-id=ho_client
medplus.image.oauth.client-secret=hO!$CL
medplus.image.transit-url=https://tpa.medplusindia.com/diagnostics/transit/image-server
medplus.image.origin=MVMS
medplus.image.transit-client-id=ho_client
medplus.image.image-type=LT

# URL shortener
medplus.shortener.base-url=https://mdpls.in
medplus.shortener.expiry-days=5

# Transactional SMS (same OAuth host as OTP)
medplus.sms.send-url=https://tpa.medplusindia.com/message-service/sms/send-sms
medplus.sms.template=MVMS_QR

# Host arrival notify (Key Management). Until MVMS_HOST_NOTIFY is registered with
# params [name, url], reuse MVMS_QR and send URL only (include-name=false).
medplus.sms.host-notify-template=MVMS_VISITOR_ALERT
medplus.sms.host-notify-include-name=true

# Key Management portal (managemet_approval app) — SMS short link target
app.host-notify.enabled=true
 app.host-notify.public-base-url=http://localhost:5175/
# app.host-notify.public-base-url=https://management-approvals.netlify.app/

# ── Visitor zone scan (movement tracking) ─────────────────────────────────────
app.visitor-scan.debounce-seconds=60

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.medplus=INFO
logging.level.org.springframework.security=WARN
